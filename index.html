<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أهلاً وسهلاً</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b1220;--bg2:#1b1030;--gold:#e9c46a;--gold2:#fff1c1;--text:#f4efe6;--muted:#b9b2c6;--ring:rgba(233,196,106,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#fbf6ea;--bg2:#f2e3c4;--gold:#a6761d;--gold2:#c9972e;--text:#2a2014;--muted:#6f6350;--ring:rgba(166,118,29,.3)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 20%,var(--bg2),var(--bg1));color:var(--text);font-family:'Cairo',Tahoma,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.stage{position:relative;padding:24px;max-width:92vw}
.rings{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.rings i{position:absolute;border:1px solid var(--ring);border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;animation:ring 5s ease-out infinite}
.rings i:nth-child(1){width:340px;height:340px}
.rings i:nth-child(2){width:340px;height:340px;animation-delay:1.6s}
.rings i:nth-child(3){width:340px;height:340px;animation-delay:3.2s}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
.hello{font-size:clamp(18px,4.5vw,26px);color:var(--muted);letter-spacing:.04em;opacity:0;transform:translateY(12px);animation:up .9s .2s forwards}
.line{width:0;height:2px;margin:18px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 1.2s .7s forwards}
@keyframes grow{to{width:min(260px,60vw)}}
.name{font-family:'Aref Ruqaa','Cairo',serif;font-weight:700;font-size:clamp(40px,12vw,84px);line-height:1.5;margin:6px 0;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .35em}
.name span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(30px) scale(.92);animation:reveal 1.1s cubic-bezier(.2,.8,.2,1) forwards;
background:linear-gradient(110deg,var(--gold) 20%,var(--gold2) 45%,var(--gold) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes reveal{60%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}
.name.done span{animation:shine 4s linear infinite;opacity:1;filter:none;transform:none}
@keyframes shine{to{background-position:-220% 0}}
.sub{font-size:clamp(16px,4vw,22px);color:var(--muted);opacity:0;transform:translateY(12px);animation:up .9s forwards}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}.rings{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="stage">
  <div class="rings"><i></i><i></i><i></i></div>
  <div class="hello">أهلاً وسهلاً بك</div>
  <div class="line"></div>
  <div class="name" id="name"></div>
  <div class="sub" id="sub">نتشرف بحضورك</div>
</div>

ان", "أسماء لمنور", "سعد لمجرد", "حاتم عمور", "أحمد الشقيري", "عمرو أديب", "منى الشاذلي", "لميس الحديدي", "وفاء الكيلاني", "نيشان", "جورج قرداحي", "مصطفى الآغا", "علي جابر", "داوود الشريان", "محمود سعد", "باسم يوسف", "إبراهيم عيسى", "يسري فودة", "خيري رمضان", "عمرو الليثي", "رزان مغربي", "أنابيلا هلال", "علا الفارس", "لجين عمران", "طارق الحبيب", "مصطفى حسني", "عمرو خالد", "علي جمعة", "عائض القرني", "طارق السويدان", "نبيل العوضي", "محمد العريفي", "عدنان إبراهيم", "محمد صلاح", "رياض محرز", "أشرف حكيمي", "سالم الدوسري", "ياسر القحطاني", "ماجد عبد الله", "سامي الجابر", "محمد أبو تريكة", "حسام حسن", "محمود الخطيب", "عصام الحضري", "محمد النني", "عمر مرموش", "مصطفى محمد", "إمام عاشور", "أحمد فتوح", "محمد الشناوي", "حازم إمام", "حسن شحاتة", "طارق حامد", "نور الشربيني", "نوران جوهر", "رامي عاشور", "علي فرج", "محمد الشوربجي", "هداية ملاك", "فريال أشرف", "جيانا فاروق", "أحمد الجندي", "سارة سمير", "منصور بن زايد", "تركي آل الشيخ", "أحمد أبو هشيمة", "نجيب ساويرس", "محمد العبار", "حسين سجواني", "لبنى العليان", "رجل الأعمال محمد الفايد", "أحمد بهجت", "طارق نور", "أحمد زويل", "مجدي يعقوب", "فاروق الباز", "مصطفى السيد", "أحمد مستجير", "سميرة موسى", "زاهي حواس", "علي مصطفى مشرفة", "مصطفى محمود", "أحمد خالد توفيق", "نجيب محفوظ", "طه حسين", "عباس محمود العقاد", "توفيق الحكيم", "إحسان عبد القدوس", "يوسف إدريس", "أحمد شوقي", "محمود درويش", "نزار قباني", "أدونيس", "أحلام مستغانمي", "غادة السمان", "رضوى عاشور", "مي زيادة", "رجاء عالم", "واسيني الأعرج", "إبراهيم نصر الله", "علاء الأسواني", "أحمد مراد", "يوسف زيدان", "جمال سليمان", "تيم حسن"];
(function(){
  var p=new URLSearchParams(location.search),name='';
  var id=parseInt(p.get('id'),10);
  if(id>0&&NAMES[id-1])name=NAMES[id-1];
  else if(p.get('n'))name=p.get('n').trim().slice(0,60);
  var box=document.getElementById('name');
  if(!name){box.textContent='';document.getElementById('sub').style.animationDelay='1s';document.getElementById('sub').textContent='نتشرف بحضورك';}
  else{
    var words=name.split(/\s+/),base=1.0;
    words.forEach(function(w,i){var s=document.createElement('span');s.textContent=w;s.style.animationDelay=(base+i*.45)+'s';box.appendChild(s);});
    var total=base+words.length*.45+1.1;
    document.getElementById('sub').style.animationDelay=(total-.4)+'s';
    setTimeout(function(){box.classList.add('done')},total*1000);
  }
  /* floating gold particles */
  var c=document.getElementById('c'),x=c.getContext('2d'),W,H,dots=[];
  function size(){var r=window.devicePixelRatio||1;W=c.width=innerWidth*r;H=c.height=innerHeight*r;}
  size();addEventListener('resize',size);
  var gold=getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||'#e9c46a';
  for(var i=0;i<60;i++)dots.push({x:Math.random(),y:Math.random(),r:Math.random()*2.2+.6,v:Math.random()*.0006+.0002,a:Math.random()*Math.PI*2});
  (function loop(t){
    x.clearRect(0,0,W,H);x.fillStyle=gold;
    dots.forEach(function(d){
      d.y-=d.v;if(d.y<-.02){d.y=1.02;d.x=Math.random();}
      x.globalAlpha=.25+.45*Math.abs(Math.sin(t/1200+d.a));
      x.beginPath();x.arc((d.x+Math.sin(t/2500+d.a)*.015)*W,d.y*H,d.r*(window.devicePixelRatio||1),0,7);x.fill();
    });
    requestAnimationFrame(loop);
  })(0);
})();

</html>
